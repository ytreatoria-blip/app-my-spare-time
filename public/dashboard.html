<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10251d">
<title>Analytics Dashboard - App My Spare Time</title>

<style>
body{
  font-family:system-ui,sans-serif;
  margin:0;
  background:#f6f3eb;
  color:#10251d
}
main{
  max-width:1000px;
  margin:auto;
  padding:22px
}
h1{
  margin-top:0
}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:30px
}
.stat-card{
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 2px 8px #0001;
  text-align:center
}
.stat-card .number{
  font-size:2.5rem;
  font-weight:800;
  color:#10251d;
  margin:10px 0
}
.stat-card .label{
  font-size:0.9rem;
  color:#666;
  text-transform:uppercase;
  letter-spacing:0.05em
}
.section{
  background:#fff;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 8px #0001
}
.section h2{
  margin-top:0;
  border-bottom:2px solid #10251d;
  padding-bottom:10px
}
.provider-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee
}
.provider-row:last-child{
  border-bottom:none
}
.provider-name{
  font-weight:600
}
.provider-count{
  background:#10251d;
  color:#fff;
  padding:4px 12px;
  border-radius:20px;
  font-size:0.9rem;
  font-weight:600
}
.click-item{
  padding:12px;
  background:#f6f3eb;
  border-radius:8px;
  margin-bottom:8px;
  font-size:0.9rem;
  border-left:4px solid #10251d
}
.click-item .provider{
  font-weight:600;
  color:#10251d
}
.click-item .time{
  color:#666;
  font-size:0.85rem;
  margin-top:4px
}
.refresh-btn{
  padding:10px 20px;
  background:#10251d;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  font-size:1rem
}
.refresh-btn:hover{
  background:#1a3a2e
}
.empty{
  color:#999;
  font-style:italic;
  padding:20px;
  text-align:center
}
</style>
</head>

<body>

<main>

<h1>📊 Analytics Dashboard</h1>

<p>Track your affiliate link clicks and monetization performance.</p>

<button class="refresh-btn" onclick="loadAnalytics()">
  🔄 Refresh Data
</button>

<div class="stats-grid">

<div class="stat-card">
<div class="label">Total Clicks</div>
<div class="number" id="totalClicks">0</div>
</div>

<div class="stat-card">
<div class="label">Providers</div>
<div class="number" id="providerCount">0</div>
</div>

<div class="stat-card">
<div class="label">Click Types</div>
<div class="number" id="typeCount">0</div>
</div>

</div>

<div class="section">
<h2>Clicks by Provider</h2>
<div id="providerStats"></div>
</div>

<div class="section">
<h2>Clicks by Type</h2>
<div id="typeStats"></div>
</div>

<div class="section">
<h2>Recent Clicks (Last 20)</h2>
<div id="recentClicks"></div>
</div>

</main>

<script>

async function loadAnalytics() {
  try {
    const response = await fetch('/api/analytics/clicks');
    const data = await response.json();

    // Update total clicks
    document.getElementById('totalClicks').textContent = data.totalClicks;

    // Update provider count
    document.getElementById('providerCount').textContent = 
      Object.keys(data.clicksByProvider).length;

    // Update type count
    document.getElementById('typeCount').textContent = 
      Object.keys(data.clicksByType).length;

    // Render provider stats
    const providerStatsHtml = Object.entries(data.clicksByProvider)
      .sort((a, b) => b[1] - a[1])
      .map(([provider, count]) => `
        <div class="provider-row">
          <span class="provider-name">${provider || 'Unknown'}</span>
          <span class="provider-count">${count} clicks</span>
        </div>
      `)
      .join('');

    document.getElementById('providerStats').innerHTML = 
      providerStatsHtml || '<div class="empty">No clicks yet</div>';

    // Render type stats
    const typeStatsHtml = Object.entries(data.clicksByType)
      .sort((a, b) => b[1] - a[1])
      .map(([type, count]) => `
        <div class="provider-row">
          <span class="provider-name">${type || 'N/A'}</span>
          <span class="provider-count">${count} clicks</span>
        </div>
      `)
      .join('');

    document.getElementById('typeStats').innerHTML = 
      typeStatsHtml || '<div class="empty">No clicks yet</div>';

    // Render recent clicks
    const recentClicksHtml = data.recentClicks
      .map(click => {
        const time = new Date(click.timestamp).toLocaleString();
        return `
          <div class="click-item">
            <span class="provider">${click.providerName}</span>
            <div class="time">${time}</div>
          </div>
        `;
      })
      .join('');

    document.getElementById('recentClicks').innerHTML = 
      recentClicksHtml || '<div class="empty">No recent clicks</div>';

  } catch (error) {
    console.error('Error loading analytics:', error);
    alert('Could not load analytics data');
  }
}

// Load analytics on page load
loadAnalytics();

// Auto-refresh every 30 seconds
setInterval(loadAnalytics, 30000);

</script>

</body>
</html>
